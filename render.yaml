services:
  - type: web
    name: room-for-personal
    runtime: docker
    plan: starter
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    numInstances: 1
    autoDeployTrigger: off
    healthCheckPath: /api/health
    disk:
      name: room-for-personal-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENVIRONMENT_NAME
        value: 개인
      - key: APP_DATA_DIR
        value: /var/data/room-for
      - key: DATABASE_URL
        value: jdbc:h2:file:/var/data/room-for/booking;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
      - key: DATABASE_PASSWORD
        generateValue: true
      - key: JAVA_TOOL_OPTIONS
        value: -Xms64m -Xmx256m -XX:+ExitOnOutOfMemoryError
